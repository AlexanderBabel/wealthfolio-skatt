name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The version is what Wealthfolio shows and what the release zip is named
      # after. Two files carry it, and a mismatch is silent until someone
      # installs the addon and sees the wrong number.
      - name: Versions in package.json and manifest.json agree
        run: |
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./manifest.json').version")
          echo "package.json=$pkg manifest.json=$man"
          [ "$pkg" = "$man" ] || { echo "::error::version mismatch"; exit 1; }
